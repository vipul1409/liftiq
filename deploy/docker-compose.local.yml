# Local environment overlay.
# Exposes all ports, enables debug logging, faster tick interval.
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
#     --env-file deploy/env/.env.local up --build

services:

  timescaledb:
    ports:
      - "5432:5432"     # expose DB for local psql / GUI clients

  simulator:
    ports:
      - "8000:8000"
    environment:
      LIFTIQ_TICK_INTERVAL: "0.5"   # faster ticks for local iteration

  ingestor:
    environment:
      LOG_LEVEL: debug
      POLL_INTERVAL_SECONDS: "5"

  compliance:
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL:            debug
      STALE_WINDOW_MINUTES: "60"    # wide window so stale data doesn't mask results
